<script>
    (function () {
        var root = document.documentElement;
        if (localStorage.getItem("theme") === "dark") { root.setAttribute("data-theme", "dark"); }
        document.getElementById("theme").addEventListener("click", function () {
            var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            root.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
        });
    })();
</script>
<script>
    (function () {
        var box = document.getElementById("lightbox");
        var img = document.getElementById("lb-img");
        var cap = document.getElementById("lb-cap");
        var shots = Array.prototype.slice.call(document.querySelectorAll(".shot"));
        var at = 0;

        function show(i) {
            at = (i + shots.length) % shots.length;
            var s = shots[at];
            img.src = s.getAttribute("data-full");
            img.alt = s.getAttribute("data-alt") || "";
            cap.textContent = (at + 1) + " / " + shots.length;
            box.classList.add("on");
        }
        function hide() { box.classList.remove("on"); img.src = ""; }

        shots.forEach(function (s, i) {
            s.addEventListener("click", function () { show(i); });
        });
        box.addEventListener("click", function (e) {
            if (e.target === box) { hide(); }
        });
        box.querySelector(".close").addEventListener("click", hide);
        box.querySelector(".prev").addEventListener("click", function (e) { e.stopPropagation(); show(at - 1); });
        box.querySelector(".next").addEventListener("click", function (e) { e.stopPropagation(); show(at + 1); });
        document.addEventListener("keydown", function (e) {
            if (!box.classList.contains("on")) { return; }
            if (e.key === "Escape") { hide(); }
            if (e.key === "ArrowLeft") { show(at - 1); }
            if (e.key === "ArrowRight") { show(at + 1); }
        });
    })();
</script>
